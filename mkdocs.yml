theme:
  name: material
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.top
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
copyright: Copyright &copy; 2026 Víctor Suárez. IES La Puebla de Vicar.  
extra_css:
  - css/styles.css
nav:
